<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-autoTagOnAdd"
    preference="autoTagOnAdd"
    data-l10n-id="pref-auto-tag-on-add"
  />
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-tagPrefix"
      data-l10n-id="pref-tag-prefix"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-tagPrefix"
      preference="tagPrefix"
    ></html:input>
  </hbox>
  <checkbox
    id="zotero-prefpane-__addonRef__-markReview"
    preference="markReview"
    data-l10n-id="pref-mark-review"
  />
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
